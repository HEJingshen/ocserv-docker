services:
  ocserv:
    image: ${OCSERV_IMAGE:-kingsonho/ocserv:1.4.2}
    container_name: ocserv
    restart: unless-stopped
    mem_limit: ${OCSERV_MEM_LIMIT:-512m}
    memswap_limit: ${OCSERV_MEMSWAP_LIMIT:-512m}

    # 网络与端口
    # 格式: "宿主机端口:容器端口"
    # 容器内部 ocserv 固定监听 443，仅可通过 OCSERV_PORT 修改宿主机端口
    ports:
      - "${OCSERV_PORT:-443}:443/tcp"
      - "${OCSERV_PORT:-443}:443/udp"

    # 隧道连接所需内核能力与设备
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

    # 启用 IPv4 转发（路由/NAT 必需）
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1

    # 挂载配置与证书（只读保护）
    volumes:
      - ./config/ocserv.conf:/etc/ocserv/ocserv.conf:ro
      - ./config/auth:/etc/ocserv/auth:rw
      - ./config/client-ca/public:/etc/ocserv/ca:ro
      - ./config/config-per-user:/etc/ocserv/config-per-user:ro
      - /etc/letsencrypt/live/${DOMAIN}/fullchain.pem:/etc/ocserv/fullchain.pem:ro
      - /etc/letsencrypt/live/${DOMAIN}/privkey.pem:/etc/ocserv/privkey.pem:ro
      - ./logs:/var/log/ocserv  # 持久化日志目录
      - ocserv-socket:/run/ocserv  # occtl socket 共享（监控栈使用）

    # 容器日志轮转（防止 stdout/stderr 撑爆磁盘）
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

    # 健康检查（基于进程状态验证）
    # 检查容器内部 443 端口（ocserv 固定监听端口）
    healthcheck:
      test: ["CMD-SHELL", "ss -tln | grep -q ':443' || exit 1"]
      interval: ${HEALTH_INTERVAL:-30s}
      timeout: ${HEALTH_TIMEOUT:-5s}
      retries: ${HEALTH_RETRIES:-3}
      start_period: ${HEALTH_START_PERIOD:-15s}

    environment:
      - TZ=${TZ:-Asia/Shanghai}

    # 加入监控网络（与 exporter/prometheus/grafana 同网络）
    networks:
      - ${NETWORK_NAME:-monitor-net}

  ocserv-auth:
    image: ${OCSERV_AUTH_IMAGE:-ocserv-auth:local}
    build:
      context: .
      dockerfile: auth/Dockerfile
    profiles:
      - tools
    network_mode: none
    stdin_open: true
    tty: true
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - ALLOW_EMPTY_P12_PASSWORD=${ALLOW_EMPTY_P12_PASSWORD:-true}
      - P12_EXPORT_PASSWORD=${P12_EXPORT_PASSWORD:-}
    volumes:
      - ./config/auth:/etc/ocserv/auth:ro
      - ./config/client-ca/public:/etc/ocserv/ca:rw
      - ./config/client-ca/private:/var/lib/ocserv-auth/private-ca:rw
      - ./config/user-certs:/var/lib/ocserv-auth/user-certs:rw
      - ./config/config-per-user:/etc/ocserv/config-per-user:rw

volumes:
  ocserv-socket:

networks:
  monitor-net:
    name: ${NETWORK_NAME:-monitor-net}
