[nginx-auth]
enabled  = true
filter   = nginx-auth
# setup-fail2ban.sh 会按 .env 中的 MONITORING_PORT 生成实际配置。
port     = 8443
logpath  = /absolute/path/to/your/project/nginx/logs/access.log
maxretry = 5
findtime = 600
bantime  = 3600
# Debian 12 / CentOS Stream 9 默认使用 nftables
# 若系统为旧版 iptables，请改为: iptables-multiport[name=nginx-auth, port="8443", protocol=tcp]
action   = nftables-multiport[name=nginx-auth, port="8443", protocol=tcp]
