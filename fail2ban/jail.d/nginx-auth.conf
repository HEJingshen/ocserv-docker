[nginx-auth]
enabled  = true
port     = http,https
filter   = nginx-auth
# ⚠️ 必须替换为 Nginx 日志映射到宿主机的绝对路径
logpath  = /absolute/path/to/your/project/nginx/logs/access.log
maxretry = 5
findtime = 600
bantime  = 3600
# Debian 12 / CentOS Stream 9 默认使用 nftables
# 若系统为旧版 iptables，请改为: iptables-multiport[name=nginx-auth, port="http,https", protocol=tcp]
action   = nftables-multiport[name=nginx-auth, port="http,https", protocol=tcp]