services:
  ocserv-exporter:
    image: ${EXPORTER_IMAGE:-kingsonho/ocserv-exporter:latest}
    container_name: ocserv-exporter
    restart: unless-stopped
    network_mode: "service:ocserv"
    volumes:
      - ocserv-socket:/var/run:ro
    environment:
      - OCSERV_SOCKET=/var/run/occtl.socket
      - METRICS_PORT=${METRICS_PORT:-9100}
    depends_on:
      ocserv:
        condition: service_healthy

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    container_name: prometheus
    restart: unless-stopped
    # ⬇️ 关键：注入子路径路由参数
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.route-prefix=/prometheus'
      - '--web.external-url=https://${DOMAIN:-your.domain.com}:${MONITORING_PORT:-8443}/prometheus'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitor-net

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=${GF_ALLOW_SIGN_UP:-false}
      # ⬇️ 关键：子路径服务配置（末尾斜杠不可省略）
      - GF_SERVER_ROOT_URL=https://${DOMAIN:-your.domain.com}:${MONITORING_PORT:-8443}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_DOMAIN=${DOMAIN:-your.domain.com}:${MONITORING_PORT:-8443}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - monitor-net
    depends_on:
      prometheus:
        condition: service_started

  nginx:
    image: ${NGINX_IMAGE:-nginx:alpine}
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "${MONITORING_PORT:-8443}:${MONITORING_PORT:-8443}"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:rw
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ${SSL_CERT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    # 使用自定义 entrypoint 处理环境变量替换
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    environment:
      - DOMAIN=${DOMAIN:-your.domain.com}
      - MONITORING_PORT=${MONITORING_PORT:-8443}
    networks:
      - monitor-net
    depends_on:
      - grafana
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
  ocserv-socket:  # 与 docker-compose.yml 共享

networks:
  monitor-net:
    name: ${NETWORK_NAME:-monitor-net}