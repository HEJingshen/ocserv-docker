services:
  ocserv-exporter:
    image: ${EXPORTER_IMAGE:-kingsonho/ocserv-exporter:1.4.2}
    container_name: ocserv-exporter
    restart: unless-stopped
    network_mode: "service:ocserv"
    volumes:
      - ocserv-socket:/run/ocserv:ro
    environment:
      - OCSERV_SOCKET=/run/ocserv/occtl.socket
      - METRICS_PORT=${METRICS_PORT:-9100}
      - EXPORTER_INTERVAL_SECONDS=${EXPORTER_INTERVAL_SECONDS:-10}
      - OCCTL_TIMEOUT_SECONDS=${OCCTL_TIMEOUT_SECONDS:-2}
      - EXPORTER_ENABLE_SESSION_DETAIL_METRICS=${EXPORTER_ENABLE_SESSION_DETAIL_METRICS:-false}
    depends_on:
      ocserv:
        condition: service_healthy

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.11.3}
    container_name: prometheus
    restart: unless-stopped
    # ⬇️ 关键：注入子路径路由参数
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.route-prefix=/prometheus'
      - '--web.external-url=http://prometheus:9090/prometheus'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitor-net

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.0.1-security-01}
    container_name: grafana
    restart: unless-stopped
    mem_limit: ${GRAFANA_MEM_LIMIT:-512m}
    memswap_limit: ${GRAFANA_MEMSWAP_LIMIT:-512m}
    cpus: ${GRAFANA_CPUS:-1.00}
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?set GF_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=${GF_ALLOW_SIGN_UP:-false}
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=${GF_DASHBOARDS_MIN_REFRESH_INTERVAL:-30s}
      - GF_ANALYTICS_REPORTING_ENABLED=${GF_ANALYTICS_REPORTING_ENABLED:-false}
      - GF_ANALYTICS_CHECK_FOR_UPDATES=${GF_ANALYTICS_CHECK_FOR_UPDATES:-false}
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=${GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES:-false}
      - GF_UNIFIED_ALERTING_EXECUTE_ALERTS=${GF_UNIFIED_ALERTING_EXECUTE_ALERTS:-false}
      - GF_DATAPROXY_RESPONSE_LIMIT=${GF_DATAPROXY_RESPONSE_LIMIT:-10485760}
      # ⬇️ 关键：子路径服务配置（末尾斜杠不可省略）
      - GF_SERVER_ROOT_URL=https://${DOMAIN:-your.domain.com}:${MONITORING_PORT:-8443}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_DOMAIN=${DOMAIN:-your.domain.com}:${MONITORING_PORT:-8443}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - monitor-net
    depends_on:
      prometheus:
        condition: service_started

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.30.2-alpine3.23-slim}
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "${MONITORING_PORT:-8443}:${MONITORING_PORT:-8443}"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:rw
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - /etc/letsencrypt/live/${DOMAIN}/fullchain.pem:/etc/letsencrypt/live/${DOMAIN}/fullchain.pem:ro
      - /etc/letsencrypt/live/${DOMAIN}/privkey.pem:/etc/letsencrypt/live/${DOMAIN}/privkey.pem:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    # 使用自定义 entrypoint 处理环境变量替换
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    environment:
      - DOMAIN=${DOMAIN:-your.domain.com}
      - MONITORING_PORT=${MONITORING_PORT:-8443}
    networks:
      - monitor-net
    depends_on:
      - grafana
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
  ocserv-socket:  # 与 docker-compose.yml 共享

networks:
  monitor-net:
    name: ${NETWORK_NAME:-monitor-net}
