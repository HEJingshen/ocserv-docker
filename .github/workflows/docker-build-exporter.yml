name: Build & Push Ocserv Exporter Image

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
    paths:
      - 'exporter/Dockerfile'
      - '.github/workflows/docker-build-exporter.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'exporter/Dockerfile'
      - '.github/workflows/docker-build-exporter.yml'

env:
  REGISTRY: docker.io
  IMAGE_NAME: kingsonho/ocserv-exporter
  OCSERV_VERSION: "1.4.2"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download source files
        run: |
          mkdir -p src
          curl -L -o src/ocserv-${{ env.OCSERV_VERSION }}.tar.xz \
            https://www.infradead.org/ocserv/download/ocserv-${{ env.OCSERV_VERSION }}.tar.xz

      - name: Set up QEMU (多架构模拟)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata (标签/注解)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 使用 ocserv 版本号作为镜像标签
            type=raw,value=${{ env.OCSERV_VERSION }}
            # main/master 分支推送时标记为 latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Set build date
        id: date
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: exporter/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 使用 GitHub Actions 原生缓存，加速多架构构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 构建参数传递
          build-args: |
            OCSERV_VERSION=${{ env.OCSERV_VERSION }}
            BUILD_DATE=${{ steps.date.outputs.BUILD_DATE }}

      - name: Test image (PR only)
        if: github.event_name == 'pull_request'
        run: |
          docker build -f exporter/Dockerfile -t test-exporter .
          docker run --rm test-exporter occtl --version || echo "occtl binary check failed"

      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.OCSERV_VERSION }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'