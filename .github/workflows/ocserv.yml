name: Build ocserv Image

on:
  workflow_call:
    inputs:
      push_enabled:
        required: true
        type: boolean
      ocserv_version:
        required: true
        type: string
      source_ocserv_artifact:
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: docker.io
  OCSERV_IMAGE_NAME: kingsonho/ocserv
  OCSERV_TARBALL_SHA256: "e35d748a5244b10be3a92ad4df95a534c8280c43680eecaf3cb1b20d2a22b1a5"
  ALPINE_VERSION: "3.23.4"
  ALPINE_IMAGE_AMD64: alpine:3.23.4@sha256:4d889c14e7d5a73929ab00be2ef8ff22437e7cbc545931e52554a7b00e123d8b
  ALPINE_IMAGE_ARM64: alpine:3.23.4@sha256:378c4c5418f7493bd500ad21ffb43818d0689daaad43e3261859fb417d1481a0

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Check shell syntax
        run: |
          sh -n scripts/configure-alpine-repositories.sh
          sh -n scripts/common.sh
          sh -n scripts/prepare-ocserv-config.sh
          sh -n scripts/render-ocserv-conf.sh
          sh -n docker/ocserv/s6-init.sh

      - name: Lint shell scripts
        run: |
          shellcheck -s sh scripts/configure-alpine-repositories.sh
          shellcheck -s sh scripts/common.sh
          shellcheck -s sh scripts/prepare-ocserv-config.sh
          shellcheck -s sh scripts/render-ocserv-conf.sh
          shellcheck -s sh docker/ocserv/s6-init.sh

      - name: Lint Dockerfile
        run: docker run --rm -v "$PWD":/work -w /work hadolint/hadolint:v2.12.0 hadolint --failure-threshold error Dockerfile

      - name: Validate Compose file
        env:
          DOMAIN: ci.example.com
        run: docker compose config --quiet

  build:
    needs: validate
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    name: Build ocserv (${{ matrix.platform.arch }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download ocserv source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.source_ocserv_artifact }}
          path: src

      - name: Verify ocserv source
        run: |
          echo "${{ env.OCSERV_TARBALL_SHA256 }}  src/ocserv-${{ inputs.ocserv_version }}.tar.xz" | sha256sum -c -

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Registry
        if: inputs.push_enabled
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set build date
        id: date
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Resolve build args
        id: build_args
        run: |
          {
            echo "args<<EOF"
            echo "ALPINE_IMAGE=${{ matrix.platform.arch == 'amd64' && env.ALPINE_IMAGE_AMD64 || env.ALPINE_IMAGE_ARM64 }}"
            echo "OCSERV_VERSION=${{ inputs.ocserv_version }}"
            echo "ALPINE_VERSION=${{ env.ALPINE_VERSION }}"
            echo "BUILD_DATE=${{ steps.date.outputs.BUILD_DATE }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and optionally push single-platform image digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          tags: ${{ env.REGISTRY }}/${{ env.OCSERV_IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ inputs.push_enabled }}
          cache-from: type=gha,scope=ocserv-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=ocserv-${{ matrix.platform.arch }}
          build-args: ${{ steps.build_args.outputs.args }}
          sbom: ${{ inputs.push_enabled }}
          provenance: ${{ inputs.push_enabled }}

      - name: Export image digest
        if: inputs.push_enabled
        run: |
          mkdir -p /tmp/digests/ocserv
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/ocserv/${digest#sha256:}"

      - name: Upload image digest
        if: inputs.push_enabled
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-ocserv-${{ matrix.platform.arch }}
          path: /tmp/digests/ocserv/*
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: inputs.push_enabled
    name: Merge manifests (ocserv)
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download amd64 image digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-ocserv-amd64
          path: /tmp/digests

      - name: Download arm64 image digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-ocserv-arm64
          path: /tmp/digests

      - name: Publish multi-arch manifests
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.OCSERV_IMAGE_NAME }}"
          mapfile -t DIGEST_FILES < <(find /tmp/digests -type f | sort)

          if [ "${#DIGEST_FILES[@]}" -ne 2 ]; then
            printf 'expected 2 image digests for %s, found %s\n' "${IMAGE_REF}" "${#DIGEST_FILES[@]}" >&2
            exit 1
          fi

          SOURCES=()
          for digest_file in "${DIGEST_FILES[@]}"; do
            SOURCES+=("${IMAGE_REF}@sha256:$(basename "${digest_file}")")
          done

          docker buildx imagetools create \
            -t "${IMAGE_REF}:${{ inputs.ocserv_version }}" \
            -t "${IMAGE_REF}:latest" \
            "${SOURCES[@]}"
