name: Build Alpine Feasibility Images

on:
  workflow_dispatch:
  push:
    branches: [ "alpine" ]
    paths:
      - 'Dockerfile.alpine'
      - 'Dockerfile.alpine-minirootfs'
      - 'exporter/Dockerfile.alpine'
      - 'exporter/Dockerfile.alpine-minirootfs'
      - '.github/workflows/docker-build-alpine.yml'
      - 'scripts/download-alpine-minirootfs.sh'
      - 'scripts/render-ocserv-conf.sh'
  pull_request:
    branches: [ "alpine" ]
    paths:
      - 'Dockerfile.alpine'
      - 'Dockerfile.alpine-minirootfs'
      - 'exporter/Dockerfile.alpine'
      - 'exporter/Dockerfile.alpine-minirootfs'
      - '.github/workflows/docker-build-alpine.yml'
      - 'scripts/download-alpine-minirootfs.sh'
      - 'scripts/render-ocserv-conf.sh'

env:
  REGISTRY: docker.io
  OCSERV_IMAGE_NAME: kingsonho/ocserv
  EXPORTER_IMAGE_NAME: kingsonho/ocserv-exporter
  OCSERV_VERSION: "1.4.2"
  S6_OVERLAY_VERSION: "3.2.3.0"
  ALPINE_VERSION: "3.23"
  ALPINE_PATCH_VERSION: "3.23.4"

jobs:
  build-ocserv-alpine:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: slim
            s6-source: apk
            tag: alpine-slim
          - flavor: full
            s6-source: apk
            tag: alpine
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download source files
        run: |
          mkdir -p src
          curl -L -o src/ocserv-${{ env.OCSERV_VERSION }}.tar.xz \
            https://www.infradead.org/ocserv/download/ocserv-${{ env.OCSERV_VERSION }}.tar.xz
          curl -L -o src/s6-overlay-noarch.tar.xz \
            https://github.com/just-containers/s6-overlay/releases/download/v${{ env.S6_OVERLAY_VERSION }}/s6-overlay-noarch.tar.xz
          curl -L -o src/s6-overlay-x86_64.tar.xz \
            https://github.com/just-containers/s6-overlay/releases/download/v${{ env.S6_OVERLAY_VERSION }}/s6-overlay-x86_64.tar.xz
          curl -L -o src/s6-overlay-aarch64.tar.xz \
            https://github.com/just-containers/s6-overlay/releases/download/v${{ env.S6_OVERLAY_VERSION }}/s6-overlay-aarch64.tar.xz

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set build date
        id: date
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build ocserv Alpine image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.alpine
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.OCSERV_IMAGE_NAME }}:${{ matrix.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OCSERV_VERSION=${{ env.OCSERV_VERSION }}
            S6_OVERLAY_VERSION=${{ env.S6_OVERLAY_VERSION }}
            ALPINE_FLAVOR=${{ matrix.flavor }}
            S6_SOURCE=${{ matrix.s6-source }}
            APK_MIRROR=https://dl-cdn.alpinelinux.org/alpine
            BUILD_DATE=${{ steps.date.outputs.BUILD_DATE }}

  build-exporter-alpine:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download source files
        run: |
          mkdir -p src
          curl -L -o src/ocserv-${{ env.OCSERV_VERSION }}.tar.xz \
            https://www.infradead.org/ocserv/download/ocserv-${{ env.OCSERV_VERSION }}.tar.xz

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set build date
        id: date
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build exporter Alpine image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: exporter/Dockerfile.alpine
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.EXPORTER_IMAGE_NAME }}:alpine
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OCSERV_VERSION=${{ env.OCSERV_VERSION }}
            APK_MIRROR=https://dl-cdn.alpinelinux.org/alpine
            BUILD_DATE=${{ steps.date.outputs.BUILD_DATE }}

  build-ocserv-alpine-minirootfs:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: slim
            s6-source: apk
            platform: linux/amd64
            alpine-arch: x86_64
            minirootfs-sha256: 85498865362aa7ebececa0d725a2f2e4db7ac4e4b2850b8df21645afa0d03ee3
          - flavor: slim
            s6-source: apk
            platform: linux/arm64
            alpine-arch: aarch64
            minirootfs-sha256: 9250667a8affac8f1e98086392f80f43f086626701e9bce33398eb9b6c0bd64c
          - flavor: full
            s6-source: apk
            platform: linux/amd64
            alpine-arch: x86_64
            minirootfs-sha256: 85498865362aa7ebececa0d725a2f2e4db7ac4e4b2850b8df21645afa0d03ee3
          - flavor: full
            s6-source: apk
            platform: linux/arm64
            alpine-arch: aarch64
            minirootfs-sha256: 9250667a8affac8f1e98086392f80f43f086626701e9bce33398eb9b6c0bd64c
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download source files
        run: |
          mkdir -p src
          curl -L -o src/ocserv-${{ env.OCSERV_VERSION }}.tar.xz \
            https://www.infradead.org/ocserv/download/ocserv-${{ env.OCSERV_VERSION }}.tar.xz
          curl -L -o src/s6-overlay-noarch.tar.xz \
            https://github.com/just-containers/s6-overlay/releases/download/v${{ env.S6_OVERLAY_VERSION }}/s6-overlay-noarch.tar.xz
          curl -L -o src/s6-overlay-x86_64.tar.xz \
            https://github.com/just-containers/s6-overlay/releases/download/v${{ env.S6_OVERLAY_VERSION }}/s6-overlay-x86_64.tar.xz
          curl -L -o src/s6-overlay-aarch64.tar.xz \
            https://github.com/just-containers/s6-overlay/releases/download/v${{ env.S6_OVERLAY_VERSION }}/s6-overlay-aarch64.tar.xz
          ALPINE_VERSION=${{ env.ALPINE_VERSION }} \
          ALPINE_PATCH_VERSION=${{ env.ALPINE_PATCH_VERSION }} \
          ALPINE_ARCH=${{ matrix.alpine-arch }} \
          ALPINE_MINIROOTFS_SHA256=${{ matrix.minirootfs-sha256 }} \
          APK_MIRROR=https://dl-cdn.alpinelinux.org/alpine \
            ./scripts/download-alpine-minirootfs.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Set build date
        id: date
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build ocserv Alpine minirootfs image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.alpine-minirootfs
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OCSERV_VERSION=${{ env.OCSERV_VERSION }}
            S6_OVERLAY_VERSION=${{ env.S6_OVERLAY_VERSION }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
            ALPINE_PATCH_VERSION=${{ env.ALPINE_PATCH_VERSION }}
            ALPINE_ARCH=${{ matrix.alpine-arch }}
            ALPINE_MINIROOTFS_SHA256=${{ matrix.minirootfs-sha256 }}
            ALPINE_FLAVOR=${{ matrix.flavor }}
            S6_SOURCE=${{ matrix.s6-source }}
            APK_MIRROR=https://dl-cdn.alpinelinux.org/alpine
            BUILD_DATE=${{ steps.date.outputs.BUILD_DATE }}

  build-exporter-alpine-minirootfs:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            alpine-arch: x86_64
            minirootfs-sha256: 85498865362aa7ebececa0d725a2f2e4db7ac4e4b2850b8df21645afa0d03ee3
          - platform: linux/arm64
            alpine-arch: aarch64
            minirootfs-sha256: 9250667a8affac8f1e98086392f80f43f086626701e9bce33398eb9b6c0bd64c
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download source files
        run: |
          mkdir -p src
          curl -L -o src/ocserv-${{ env.OCSERV_VERSION }}.tar.xz \
            https://www.infradead.org/ocserv/download/ocserv-${{ env.OCSERV_VERSION }}.tar.xz
          ALPINE_VERSION=${{ env.ALPINE_VERSION }} \
          ALPINE_PATCH_VERSION=${{ env.ALPINE_PATCH_VERSION }} \
          ALPINE_ARCH=${{ matrix.alpine-arch }} \
          ALPINE_MINIROOTFS_SHA256=${{ matrix.minirootfs-sha256 }} \
          APK_MIRROR=https://dl-cdn.alpinelinux.org/alpine \
            ./scripts/download-alpine-minirootfs.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Set build date
        id: date
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build exporter Alpine minirootfs image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: exporter/Dockerfile.alpine-minirootfs
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OCSERV_VERSION=${{ env.OCSERV_VERSION }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
            ALPINE_PATCH_VERSION=${{ env.ALPINE_PATCH_VERSION }}
            ALPINE_ARCH=${{ matrix.alpine-arch }}
            ALPINE_MINIROOTFS_SHA256=${{ matrix.minirootfs-sha256 }}
            APK_MIRROR=https://dl-cdn.alpinelinux.org/alpine
            BUILD_DATE=${{ steps.date.outputs.BUILD_DATE }}
