name: Build Alpine Images

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'Dockerfile'
      - '**/Dockerfile'
      - '.github/workflows/**'
      - 'auth/**'
      - 'config/**'
      - 'docker-compose*.yml'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'Dockerfile'
      - '**/Dockerfile'
      - '.github/workflows/**'
      - 'auth/**'
      - 'config/**'
      - 'docker-compose*.yml'
      - 'scripts/**'
      - 'tests/**'

env:
  REGISTRY: docker.io
  OCSERV_IMAGE_NAME: kingsonho/ocserv
  EXPORTER_IMAGE_NAME: kingsonho/ocserv-exporter
  OCSERV_VERSION: "1.4.2"
  OCSERV_TARBALL_SHA256: "e35d748a5244b10be3a92ad4df95a534c8280c43680eecaf3cb1b20d2a22b1a5"
  ALPINE_VERSION: "3.23.4"
  ALPINE_IMAGE_AMD64: alpine:3.23.4@sha256:4d889c14e7d5a73929ab00be2ef8ff22437e7cbc545931e52554a7b00e123d8b
  ALPINE_IMAGE_ARM64: alpine:3.23.4@sha256:378c4c5418f7493bd500ad21ffb43818d0689daaad43e3261859fb417d1481a0

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnutls-bin

      - name: Run unit tests
        run: |
          python3 -m unittest exporter/test_ocserv_exporter.py tests/test_fail2ban_filter.py tests/test_static_config.py

      - name: Check shell scripts
        run: |
          sh -n scripts/render-ocserv-conf.sh
          sh -n scripts/configure-alpine-repositories.sh
          sh -n scripts/prepare-ocserv-config.sh
          sh -n scripts/prepare-monitoring-config.sh
          sh -n nginx/docker-entrypoint.sh
          sh -n docker/ocserv/s6-init.sh
          bash -n scripts/ocserv-cert-auth.sh
          bash -n scripts/setup-fail2ban.sh
          sh tests/test_nginx_entrypoint.sh
          sh tests/test_ocserv_cert_auth.sh

      - name: Lint Dockerfiles
        run: |
          docker run --rm -v "$PWD":/work -w /work hadolint/hadolint:v2.12.0 hadolint --failure-threshold error Dockerfile exporter/Dockerfile auth/Dockerfile

      - name: Build auth tool image
        run: |
          docker build --pull -f auth/Dockerfile -t ocserv-auth:ci .

      - name: Validate Compose files
        env:
          # CI-only value for Compose interpolation; production must set this in .env.
          DOMAIN: ci.example.com
          GF_ADMIN_PASSWORD: ci-validation-only
          SKIP_TLS_CHECK: "true"
        run: |
          EDITOR=true ./scripts/prepare-monitoring-config.sh
          docker compose config >/tmp/docker-compose.yml
          docker compose -f docker-compose.yml -f docker-compose.monitoring.yml config >/tmp/docker-compose.monitoring.yml

  build-ocserv:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download source files
        run: |
          mkdir -p src
          curl -L -o src/ocserv-${{ env.OCSERV_VERSION }}.tar.xz \
            https://www.infradead.org/ocserv/download/ocserv-${{ env.OCSERV_VERSION }}.tar.xz
          echo "${{ env.OCSERV_TARBALL_SHA256 }}  src/ocserv-${{ env.OCSERV_VERSION }}.tar.xz" | sha256sum -c -

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set build date
        id: date
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build ocserv amd64
        id: ocserv_amd64
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.OCSERV_IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OCSERV_VERSION=${{ env.OCSERV_VERSION }}
            ALPINE_IMAGE=${{ env.ALPINE_IMAGE_AMD64 }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
            APK_MIRROR=https://dl-cdn.alpinelinux.org/alpine
            BUILD_DATE=${{ steps.date.outputs.BUILD_DATE }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' }}

      - name: Build ocserv arm64
        id: ocserv_arm64
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.OCSERV_IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OCSERV_VERSION=${{ env.OCSERV_VERSION }}
            ALPINE_IMAGE=${{ env.ALPINE_IMAGE_ARM64 }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
            APK_MIRROR=https://dl-cdn.alpinelinux.org/alpine
            BUILD_DATE=${{ steps.date.outputs.BUILD_DATE }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' }}

      - name: Push ocserv manifests
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.OCSERV_IMAGE_NAME }}:${{ env.OCSERV_VERSION }} \
            ${{ env.REGISTRY }}/${{ env.OCSERV_IMAGE_NAME }}@${{ steps.ocserv_amd64.outputs.digest }} \
            ${{ env.REGISTRY }}/${{ env.OCSERV_IMAGE_NAME }}@${{ steps.ocserv_arm64.outputs.digest }}
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.OCSERV_IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.OCSERV_IMAGE_NAME }}:${{ env.OCSERV_VERSION }}

  build-exporter:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download source files
        run: |
          mkdir -p src
          curl -L -o src/ocserv-${{ env.OCSERV_VERSION }}.tar.xz \
            https://www.infradead.org/ocserv/download/ocserv-${{ env.OCSERV_VERSION }}.tar.xz
          echo "${{ env.OCSERV_TARBALL_SHA256 }}  src/ocserv-${{ env.OCSERV_VERSION }}.tar.xz" | sha256sum -c -

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set build date
        id: date
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build exporter amd64
        id: exporter_amd64
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: exporter/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.EXPORTER_IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OCSERV_VERSION=${{ env.OCSERV_VERSION }}
            ALPINE_IMAGE=${{ env.ALPINE_IMAGE_AMD64 }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
            APK_MIRROR=https://dl-cdn.alpinelinux.org/alpine
            BUILD_DATE=${{ steps.date.outputs.BUILD_DATE }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' }}

      - name: Build exporter arm64
        id: exporter_arm64
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: exporter/Dockerfile
          platforms: linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.EXPORTER_IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OCSERV_VERSION=${{ env.OCSERV_VERSION }}
            ALPINE_IMAGE=${{ env.ALPINE_IMAGE_ARM64 }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
            APK_MIRROR=https://dl-cdn.alpinelinux.org/alpine
            BUILD_DATE=${{ steps.date.outputs.BUILD_DATE }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' }}

      - name: Push exporter manifest
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.EXPORTER_IMAGE_NAME }}:${{ env.OCSERV_VERSION }} \
            ${{ env.REGISTRY }}/${{ env.EXPORTER_IMAGE_NAME }}@${{ steps.exporter_amd64.outputs.digest }} \
            ${{ env.REGISTRY }}/${{ env.EXPORTER_IMAGE_NAME }}@${{ steps.exporter_arm64.outputs.digest }}
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.EXPORTER_IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.EXPORTER_IMAGE_NAME }}:${{ env.OCSERV_VERSION }}
