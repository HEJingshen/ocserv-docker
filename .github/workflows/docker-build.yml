name: Build Alpine Images

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'Dockerfile'
      - '**/Dockerfile'
      - '.github/workflows/**'
      - 'auth/**'
      - 'config/**'
      - 'docker-compose*.yml'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'Dockerfile'
      - '**/Dockerfile'
      - '.github/workflows/**'
      - 'auth/**'
      - 'config/**'
      - 'docker-compose*.yml'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  OCSERV_IMAGE_NAME: kingsonho/ocserv
  EXPORTER_IMAGE_NAME: kingsonho/ocserv-exporter
  OCSERV_VERSION: "1.4.2"
  OCSERV_TARBALL_SHA256: "e35d748a5244b10be3a92ad4df95a534c8280c43680eecaf3cb1b20d2a22b1a5"
  ALPINE_VERSION: "3.23.4"
  ALPINE_IMAGE_AMD64: alpine:3.23.4@sha256:4d889c14e7d5a73929ab00be2ef8ff22437e7cbc545931e52554a7b00e123d8b
  ALPINE_IMAGE_ARM64: alpine:3.23.4@sha256:378c4c5418f7493bd500ad21ffb43818d0689daaad43e3261859fb417d1481a0

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnutls-bin

      - name: Run unit tests
        run: |
          python3 -m unittest exporter/test_ocserv_exporter.py tests/test_fail2ban_filter.py tests/test_static_config.py

      - name: Check shell scripts
        run: |
          sh -n scripts/render-ocserv-conf.sh
          sh -n scripts/configure-alpine-repositories.sh
          sh -n scripts/prepare-ocserv-config.sh
          sh -n scripts/prepare-monitoring-config.sh
          sh -n nginx/docker-entrypoint.sh
          sh -n docker/ocserv/s6-init.sh
          bash -n scripts/ocserv-cert-auth.sh
          bash -n scripts/setup-fail2ban.sh
          sh tests/test_nginx_entrypoint.sh
          sh tests/test_ocserv_cert_auth.sh

      - name: Lint Dockerfiles
        run: |
          docker run --rm -v "$PWD":/work -w /work hadolint/hadolint:v2.12.0 hadolint --failure-threshold error Dockerfile exporter/Dockerfile auth/Dockerfile

      - name: Build auth tool image
        run: |
          docker build --pull -f auth/Dockerfile -t ocserv-auth:ci .

      - name: Validate Compose files
        env:
          # CI-only value for Compose interpolation; production must set this in .env.
          DOMAIN: ci.example.com
          GF_ADMIN_PASSWORD: ci-validation-only
          SKIP_TLS_CHECK: "true"
        run: |
          EDITOR=true ./scripts/prepare-monitoring-config.sh
          docker compose config >/tmp/docker-compose.yml
          docker compose -f docker-compose.yml -f docker-compose.monitoring.yml config >/tmp/docker-compose.monitoring.yml

  build-images:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    name: Build ${{ matrix.image_type }} (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        image_type: [ocserv, exporter]
        platform: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download source files
        run: |
          mkdir -p src
          curl -L -o src/ocserv-${{ env.OCSERV_VERSION }}.tar.xz \
            https://www.infradead.org/ocserv/download/ocserv-${{ env.OCSERV_VERSION }}.tar.xz
          echo "${{ env.OCSERV_TARBALL_SHA256 }}  src/ocserv-${{ env.OCSERV_VERSION }}.tar.xz" | sha256sum -c -

      - name: Set up QEMU
        if: matrix.platform == 'arm64'
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set build date
        id: date
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build and optionally push single-platform image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.image_type == 'ocserv' && 'Dockerfile' || 'exporter/Dockerfile' }}
          platforms: linux/${{ matrix.platform }}
          tags: ${{ env.REGISTRY }}/${{ matrix.image_type == 'ocserv' && env.OCSERV_IMAGE_NAME || env.EXPORTER_IMAGE_NAME }}:${{ env.OCSERV_VERSION }}-${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
          cache-from: type=gha,scope=${{ matrix.image_type }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_type }}-${{ matrix.platform }}
          build-args: |
            OCSERV_VERSION=${{ env.OCSERV_VERSION }}
            ALPINE_IMAGE=${{ matrix.platform == 'amd64' && env.ALPINE_IMAGE_AMD64 || env.ALPINE_IMAGE_ARM64 }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
            APK_MIRROR=https://dl-cdn.alpinelinux.org/alpine
            BUILD_DATE=${{ steps.date.outputs.BUILD_DATE }}
          sbom: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
          provenance: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}

  merge-manifests:
    needs: build-images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    name: Merge manifests (${{ matrix.image_type }})
    strategy:
      matrix:
        image_type: [ocserv, exporter]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-arch manifests
        run: |
          IMAGE_NAME="${{ matrix.image_type == 'ocserv' && env.OCSERV_IMAGE_NAME || env.EXPORTER_IMAGE_NAME }}"
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${IMAGE_NAME}:${{ env.OCSERV_VERSION }} \
            -t ${{ env.REGISTRY }}/${IMAGE_NAME}:latest \
            ${{ env.REGISTRY }}/${IMAGE_NAME}:${{ env.OCSERV_VERSION }}-amd64 \
            ${{ env.REGISTRY }}/${IMAGE_NAME}:${{ env.OCSERV_VERSION }}-arm64
