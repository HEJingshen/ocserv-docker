name: Build Alpine Images

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'Dockerfile'
      - '**/Dockerfile'
      - 'VERSION'
      - '.github/workflows/**'
      - 'auth/**'
      - 'config/**'
      - 'docker-compose*.yml'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'Dockerfile'
      - '**/Dockerfile'
      - 'VERSION'
      - '.github/workflows/**'
      - 'auth/**'
      - 'config/**'
      - 'docker-compose*.yml'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  OCSERV_IMAGE_NAME: kingsonho/ocserv
  OCSERV_AUTH_IMAGE_NAME: kingsonho/ocserv-auth
  OCSERV_TARBALL_SHA256: "e35d748a5244b10be3a92ad4df95a534c8280c43680eecaf3cb1b20d2a22b1a5"
  ALPINE_VERSION: "3.23.4"
  ALPINE_IMAGE_AMD64: alpine:3.23.4@sha256:4d889c14e7d5a73929ab00be2ef8ff22437e7cbc545931e52554a7b00e123d8b
  ALPINE_IMAGE_ARM64: alpine:3.23.4@sha256:378c4c5418f7493bd500ad21ffb43818d0689daaad43e3261859fb417d1481a0

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check shell scripts
        run: |
          for f in scripts/render-ocserv-conf.sh scripts/configure-alpine-repositories.sh scripts/prepare-ocserv-config.sh scripts/migrate-legacy-cert-auth.sh docker/ocserv/s6-init.sh tests/test_ocserv_cert_auth.sh tests/test_migrate_legacy_cert_auth.sh; do
            sh -n "$f"
          done
          for f in scripts/ocserv-cert-auth.sh install-docker.sh; do
            bash -n "$f"
          done

      - name: Lint Dockerfiles
        run: docker run --rm -v "$PWD":/work -w /work hadolint/hadolint:v2.12.0 hadolint --failure-threshold error Dockerfile auth/Dockerfile

      - name: Build auth tool image
        run: docker build --pull -f auth/Dockerfile -t ocserv-auth:ci .

      - name: Validate Compose files
        env:
          # CI-only value for Compose interpolation; production must set this in .env.
          DOMAIN: ci.example.com
          SKIP_TLS_CHECK: "true"
        run: |
          docker compose config >/tmp/docker-compose.yml

  build-images:
    needs: validate
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    name: Build ${{ matrix.image.type }} (${{ matrix.platform.arch }})
    strategy:
      fail-fast: false
      matrix:
        image:
          - type: ocserv
            dockerfile: Dockerfile
            name_var: OCSERV_IMAGE_NAME
            needs_source: "true"
          - type: auth
            dockerfile: auth/Dockerfile
            name_var: OCSERV_AUTH_IMAGE_NAME
            needs_source: "false"
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Load ocserv version
        run: echo "OCSERV_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Download source files
        if: matrix.image.needs_source == 'true'
        run: |
          mkdir -p src
          curl -fsSL -o src/ocserv-${{ env.OCSERV_VERSION }}.tar.xz \
            https://www.infradead.org/ocserv/download/ocserv-${{ env.OCSERV_VERSION }}.tar.xz
          echo "${{ env.OCSERV_TARBALL_SHA256 }}  src/ocserv-${{ env.OCSERV_VERSION }}.tar.xz" | sha256sum -c -

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set build date
        id: date
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Resolve build args
        id: build_args
        run: |
          {
            echo "args<<EOF"
            echo "ALPINE_IMAGE=${{ matrix.platform.arch == 'amd64' && env.ALPINE_IMAGE_AMD64 || env.ALPINE_IMAGE_ARM64 }}"
            echo "APK_MIRROR=https://dl-cdn.alpinelinux.org/alpine"
            if [ "${{ matrix.image.needs_source }}" = "true" ]; then
              echo "OCSERV_VERSION=${{ env.OCSERV_VERSION }}"
              echo "ALPINE_VERSION=${{ env.ALPINE_VERSION }}"
              echo "BUILD_DATE=${{ steps.date.outputs.BUILD_DATE }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and optionally push single-platform image digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          tags: ${{ env.REGISTRY }}/${{ env[matrix.image.name_var] }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
          cache-from: type=gha,scope=${{ matrix.image.type }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.type }}-${{ matrix.platform.arch }}
          build-args: ${{ steps.build_args.outputs.args }}
          sbom: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
          provenance: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}

      - name: Export image digest
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          mkdir -p /tmp/digests/${{ matrix.image.type }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.image.type }}/${digest#sha256:}"

      - name: Upload image digest
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image.type }}-${{ matrix.platform.arch }}
          path: /tmp/digests/${{ matrix.image.type }}/*
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    needs: build-images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    name: Merge manifests (${{ matrix.image.type }})
    strategy:
      matrix:
        image:
          - type: ocserv
            name_var: OCSERV_IMAGE_NAME
          - type: auth
            name_var: OCSERV_AUTH_IMAGE_NAME
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Load ocserv version
        run: echo "OCSERV_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.image.type }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Publish multi-arch manifests
        env:
          IMAGE_NAME: ${{ env[matrix.image.name_var] }}
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${IMAGE_NAME}"
          mapfile -t DIGEST_FILES < <(find /tmp/digests -type f | sort)

          if [ "${#DIGEST_FILES[@]}" -ne 2 ]; then
            printf 'expected 2 image digests for %s, found %s\n' "${IMAGE_NAME}" "${#DIGEST_FILES[@]}" >&2
            exit 1
          fi

          SOURCES=()
          for digest_file in "${DIGEST_FILES[@]}"; do
            SOURCES+=("${IMAGE_REF}@sha256:$(basename "${digest_file}")")
          done

          docker buildx imagetools create \
            -t "${IMAGE_REF}:${{ env.OCSERV_VERSION }}" \
            -t "${IMAGE_REF}:latest" \
            "${SOURCES[@]}"
