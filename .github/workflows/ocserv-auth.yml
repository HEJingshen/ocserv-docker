name: Build ocserv Auth Image

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'auth/Dockerfile'
      - 'VERSION'
      - '.github/workflows/ocserv-auth.yml'
      - 'docker-compose.yml'
      - 'scripts/configure-alpine-repositories.sh'
      - 'scripts/ocserv-cert-auth.sh'
      - 'scripts/migrate-legacy-cert-auth.sh'
      - 'scripts/render-ocserv-conf.sh'
      - 'tests/test_ocserv_cert_auth.sh'
      - 'tests/test_migrate_legacy_cert_auth.sh'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'auth/Dockerfile'
      - 'VERSION'
      - '.github/workflows/ocserv-auth.yml'
      - 'docker-compose.yml'
      - 'scripts/configure-alpine-repositories.sh'
      - 'scripts/ocserv-cert-auth.sh'
      - 'scripts/migrate-legacy-cert-auth.sh'
      - 'scripts/render-ocserv-conf.sh'
      - 'tests/test_ocserv_cert_auth.sh'
      - 'tests/test_migrate_legacy_cert_auth.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  OCSERV_AUTH_IMAGE_NAME: kingsonho/ocserv-auth
  ALPINE_IMAGE_AMD64: alpine:3.23.4@sha256:4d889c14e7d5a73929ab00be2ef8ff22437e7cbc545931e52554a7b00e123d8b
  ALPINE_IMAGE_ARM64: alpine:3.23.4@sha256:378c4c5418f7493bd500ad21ffb43818d0689daaad43e3261859fb417d1481a0

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Check shell syntax
        run: |
          sh -n scripts/configure-alpine-repositories.sh
          bash -n scripts/ocserv-cert-auth.sh
          sh -n scripts/migrate-legacy-cert-auth.sh
          sh -n tests/test_ocserv_cert_auth.sh
          sh -n tests/test_migrate_legacy_cert_auth.sh

      - name: Lint shell scripts
        run: |
          shellcheck -s sh scripts/configure-alpine-repositories.sh
          shellcheck -s bash scripts/ocserv-cert-auth.sh
          shellcheck -s sh scripts/migrate-legacy-cert-auth.sh

      - name: Lint Dockerfile
        run: docker run --rm -v "$PWD":/work -w /work hadolint/hadolint:v2.12.0 hadolint --failure-threshold error auth/Dockerfile

      - name: Validate Compose file
        env:
          DOMAIN: ci.example.com
        run: docker compose config --quiet

  build:
    needs: validate
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    name: Build ocserv-auth (${{ matrix.platform.arch }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Load ocserv version
        id: version
        run: |
          OCSERV_VERSION="$(cat VERSION)"
          echo "OCSERV_VERSION=${OCSERV_VERSION}" >> "$GITHUB_ENV"
          echo "ocserv_version=${OCSERV_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build args
        id: build_args
        run: |
          {
            echo "args<<EOF"
            echo "ALPINE_IMAGE=${{ matrix.platform.arch == 'amd64' && env.ALPINE_IMAGE_AMD64 || env.ALPINE_IMAGE_ARM64 }}"
            echo "APK_MIRROR=https://dl-cdn.alpinelinux.org/alpine"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and optionally push single-platform image digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: auth/Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          tags: ${{ env.REGISTRY }}/${{ env.OCSERV_AUTH_IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
          cache-from: type=gha,scope=ocserv-auth-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=ocserv-auth-${{ matrix.platform.arch }}
          build-args: ${{ steps.build_args.outputs.args }}
          sbom: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
          provenance: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}

      - name: Export image digest
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          mkdir -p /tmp/digests/ocserv-auth
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/ocserv-auth/${digest#sha256:}"

      - name: Upload image digest
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-ocserv-auth-${{ matrix.platform.arch }}
          path: /tmp/digests/ocserv-auth/*
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    name: Merge manifests (ocserv-auth)
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Load ocserv version
        id: version
        run: |
          OCSERV_VERSION="$(cat VERSION)"
          echo "OCSERV_VERSION=${OCSERV_VERSION}" >> "$GITHUB_ENV"
          echo "ocserv_version=${OCSERV_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download amd64 image digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-ocserv-auth-amd64
          path: /tmp/digests

      - name: Download arm64 image digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-ocserv-auth-arm64
          path: /tmp/digests

      - name: Publish multi-arch manifests
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.OCSERV_AUTH_IMAGE_NAME }}"
          mapfile -t DIGEST_FILES < <(find /tmp/digests -type f | sort)

          if [ "${#DIGEST_FILES[@]}" -ne 2 ]; then
            printf 'expected 2 image digests for %s, found %s\n' "${IMAGE_REF}" "${#DIGEST_FILES[@]}" >&2
            exit 1
          fi

          SOURCES=()
          for digest_file in "${DIGEST_FILES[@]}"; do
            SOURCES+=("${IMAGE_REF}@sha256:$(basename "${digest_file}")")
          done

          docker buildx imagetools create \
            -t "${IMAGE_REF}:${{ steps.version.outputs.ocserv_version }}" \
            -t "${IMAGE_REF}:latest" \
            "${SOURCES[@]}"
